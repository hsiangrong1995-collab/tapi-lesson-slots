<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAPI上課時段匯出工具</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f9;color:#243746;font:15px system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:38px 24px}header,.bar,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:30px;margin:0}p{color:#667b88;line-height:1.7}button,input,select{font:inherit;border:1px solid #d5dfe4;border-radius:9px;padding:10px 14px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#eaf2f5}button.active,.primary{background:#147d91;color:white;border-color:#147d91}.card{background:white;border:1px solid #dde5e9;border-radius:16px;margin-top:22px;padding:20px}.bar{justify-content:space-between}.hint{font-size:13px}#gridWrap{overflow:auto;margin-top:18px;max-height:65vh;border:1px solid #e2e9ed;border-radius:10px}#grid{display:grid;grid-template-columns:70px repeat(7,minmax(105px,1fr));min-width:805px;user-select:none}.head{position:sticky;top:0;background:#f4f8fa;padding:12px 6px;text-align:center;z-index:2;border-bottom:1px solid #dae4e8;font-weight:600}.time{font-size:12px;text-align:right;padding:6px 12px 0 0;color:#6b7b84;height:29px}.slot{height:29px;border:0;border-right:1px solid #e8eef1;border-bottom:1px solid #e8eef1;border-radius:0;padding:0;background:white;touch-action:pan-y}.slot:hover{background:#e2f3f5}.slot.on{background:#8cd9de;border-color:#74cbd2}.slot.on:hover{background:#57bec8}.slot:focus-visible{outline:2px solid #174e73;outline-offset:-3px}.stats{font-size:14px;color:#147d91}#list{display:grid;gap:12px;margin-top:18px}.day{display:flex;gap:28px;align-items:baseline;border-bottom:1px solid #edf1f4;padding:15px 6px}.day strong{min-width:140px}.pill{display:inline-block;background:#e2f4f4;color:#126779;padding:7px 12px;border-radius:8px;margin:3px}.empty{text-align:center;padding:55px;color:#71838e}footer{font-size:12px;color:#7b8c96;margin-top:24px}.notice{min-height:20px;color:#147d91;font-size:13px}label{display:inline-flex;align-ite .date-red{color:#c33741}.holiday-name{display:block;font-size:11px;font-weight:500;line-height:1.5;margin-top:4px;min-height:17px;white-space:normal}.head{min-height:67px}.day>strong{display:block}.holiday-source a{color:inherit}#gridWrap{max-height:none;overflow:visible;border:0}#grid{display:grid;grid-template-columns:1fr;min-width:0;gap:20px}.week-panel{min-width:0}.week-panel h3{font-size:14px;margin:0 0 12px;color:#667b88}.week-scroll{overflow:auto;max-height:65vh;border:1px solid #e2e9ed;border-radius:10px}.week-grid{display:grid;grid-template-columns:54px repeat(7,minmax(68px,1fr));min-width:560px;user-select:none}.mode-picker{margin-top:20px}.mode-picker #inperson.active{background:#b36e24;border-color:#b36e24}.inperson .slot.on{background:#f4d09e;border-color:#e9bb7e}.inperson .slot.on:hover{background:#eabb7e}.pill.inperson{background:#fff0da;color:#8c5216}.online-label{color:#147d91}.offline-label{color:#97591d}.mode-line{margin:6px 0}.mode-line b{display:inline-block;min-width:160px;font-size:13px}#editing{font-size:13px;color:#667b88}@media(max-width:1050px){#grid{grid-template-columns:1fr}}main{max-width:1500px}</style><main><header><div><div style="color:#147d91;font-size:12px;letter-spacing:3px;margin-bottom:8px">TAPI · AVAILABILITY</div><h1>TAPI上課時段匯出工具</h1></div><div class="actions"><button id="calendar" class="active">一週行事曆</button><button id="listBtn">時段清單</button></div></header><section class="card"><div class="actions" style="margin-bottom:20px"><label>我是 <input id="teacher" type="text" maxlength="50" placeholder="請輸入姓名" autocomplete="name" style="width:180px"></label></div><div class="actions mode-picker"><button id="online" class="active">線上（オンライン）</button><button id="inperson">線下（対面）</button><strong id="editing"></strong></div><p class="hint">線上與線下分開設定，可同時選擇同一時段。每格 30 分鐘。點一下標為可上課，再點一下取消；電腦可按住滑鼠連續塗選。清單會自動合併相連時段。</p><div class="actions secondary"><label>顯示時間 <select id="start"></select> 至 <select id="end"></select></label><label>時區 <select id="zone"><option value="Asia/Tokyo">日本 UTC+9</option><option value="Asia/Taipei">台灣 UTC+8</option><option value="Asia/Hong_Kong">香港 UTC+8</option></select></label><button id="copyMode">將目前設定套用到線下（対面）</button><button id="copyWeek">目前類型套用到下一週</button><button id="clear">清空目前類型的一週</button></div><div class="bar" style="margin-top:20px;margin-bottom:14px"><div class="actions"><button id="prev" aria-label="上一週">←</button><button id="today">本週</button><button id="next" aria-label="下一週">→</button><strong id="range"></strong><input id="date" type="date" aria-label="跳至日期"></div><span class="stats" id="stats"></span></div><div id="gridWrap"><div id="grid"></div></div><div id="list" hidden></div></section><section class="card"><div class="bar"><div><strong>匯出資料</strong><p class="hint">依選取的起訖日期，匯出線上與線下時段；備份全部不受日期範圍限制。</p></div><div class="actions"><label>匯出日期 <input id="exportStart" type="date" aria-label="匯出開始日期"> ～ <input id="exportEnd" type="date" aria-label="匯出結束日期"></label><button id="copy">複製文字檔</button><button id="csv">匯出 CSV (.csv)</button><button id="txt">匯出文字檔 (.txt)</button><button id="ics">匯出行事曆 (.ics)</button><div style="position:relative;display:inline-flex;align-items:center"><button id="backup">備份全部</button><small style="position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:#7b8c96">換裝置清除瀏覽器資料時</small></div><button id="restore">上傳備份</button><input id="file" type="file" accept="application/json,.json" hidden></div></div><div class="notice" style="margin-top:24px" id="notice" role="status"></div></section><footer>自動儲存在目前瀏覽器，跨裝置請使用備份與還原。時區設定只改變時段的時區標記，不換算已選時間。匯出的行事曆為可上課時段，並非已預約課程。 <span class="holiday-source">日本祝日資料：<a href="https://www.benri.com/calendar/" target="_blank" rel="noopener">2026 年</a>・<a href="https://www.benri.com/calendar/2027.html" target="_blank" rel="noopener">2027 年</a>（含振替休日、国民の休日）。</span></footer></main><script>

// Japanese holidays: https://www.benri.com/calendar/ and https://www.benri.com/calendar/2027.html
const holidays={"2026-01-01":"元日","2026-01-12":"成人の日","2026-02-11":"建国記念の日","2026-02-23":"天皇誕生日","2026-03-20":"春分の日","2026-04-29":"昭和の日","2026-05-03":"憲法記念日","2026-05-04":"みどりの日","2026-05-05":"こどもの日","2026-05-06":"振替休日","2026-07-20":"海の日","2026-08-11":"山の日","2026-09-21":"敬老の日","2026-09-22":"国民の休日","2026-09-23":"秋分の日","2026-10-12":"スポーツの日","2026-11-03":"文化の日","2026-11-23":"勤労感謝の日","2027-01-01":"元日","2027-01-11":"成人の日","2027-02-11":"建国記念の日","2027-02-23":"天皇誕生日","2027-03-21":"春分の日","2027-03-22":"振替休日","2027-04-29":"昭和の日","2027-05-03":"憲法記念日","2027-05-04":"みどりの日","2027-05-05":"こどもの日","2027-07-19":"海の日","2027-08-11":"山の日","2027-09-20":"敬老の日","2027-09-23":"秋分の日","2027-10-11":"スポーツの日","2027-11-03":"文化の日","2027-11-23":"勤労感謝の日"};
function decorateDate(el,k){const d=new Date(k+'T12:00:00');el.classList.toggle('date-red',d.getDay()===0||d.getDay()===6||!!holidays[k]);if(holidays[k]){const name=document.createElement('small');name.className='holiday-name';name.textContent=holidays[k];el.append(name)}}
const $=id=>document.getElementById(id),key='lesson-slots-v1',labels={online:'線上（オンライン）',inperson:'線下（対面）'};
function normalize(v){if(!v||!['Asia/Tokyo','Asia/Taipei','Asia/Hong_Kong'].includes(v.zone)||!Number.isInteger(v.start)||!Number.isInteger(v.end)||v.start<0||v.end>24||v.start>=v.end)throw Error('設定格式錯誤');const modes=v.modes||{online:v.slots||{},inperson:{}};const result={teacher:typeof v.teacher==='string'?v.teacher.slice(0,50):'',version:2,zone:v.zone,start:v.start,end:v.end,modes:{online:{},inperson:{}}};for(const mode of Object.keys(labels)){const dates=modes[mode];if(!dates||typeof dates!=='object'||Array.isArray(dates))throw Error();for(const[k,slots]of Object.entries(dates)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!slots||typeof slots!=='object'||Array.isArray(slots))throw Error();result.modes[mode][k]={};for(const[n,on]of Object.entries(slots)){if(!/^\d+$/.test(n)||+n>47||typeof on!=='boolean')throw Error();if(on)result.modes[mode][k][n]=true}}}return result}
let data=normalize({slots:{},zone:'Asia/Tokyo',start:9,end:24});try{data=normalize(JSON.parse(localStorage.getItem(key)||'null'))}catch{}let mode='online',view='calendar',base=monday(new Date()),painting=false,paint=true;
function monday(d){d=new Date(d);d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d}function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function day(i){const d=new Date(base);d.setDate(d.getDate()+i);return d}function upcomingIds(){const start=monday(new Date());return Array.from({length:35},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return dateKey(d)})}function exportIds(){const a=$('exportStart').value,b=$('exportEnd').value;if(!a||!b||a>b){$('notice').textContent='請選擇有效的匯出起訖日期（結束日需等於或晚於開始日）。';return null}const from=new Date(a+'T12:00:00'),to=new Date(b+'T12:00:00'),result=[];for(let d=new Date(from);d<=to;d.setDate(d.getDate()+1)){result.push(dateKey(d));if(result.length>3660){$('notice').textContent='匯出範圍請設定在10年以內。';return null}}return result}function ids(){return Array.from({length:7},(_,i)=>dateKey(day(i)))}function fmt(n){return `${String(Math.floor(n/2)).padStart(2,'0')}:${n%2?'30':'00'}`}function spans(k,m=mode){const nums=Object.keys(data.modes[m][k]||{}).map(Number).filter(n=>data.modes[m][k][n]).sort((a,b)=>a-b),r=[];for(const n of nums){const last=r.at(-1);if(last&&last[1]===n)last[1]++;else r.push([n,n+1])}return r}function save(){try{localStorage.setItem(key,JSON.stringify(data));$('notice').textContent='已自動儲存'}catch{$('notice').textContent='無法自動儲存，請匯出備份保留資料。'}}function summary(){$('stats').textContent=Object.keys(labels).map(m=>{const n=ids().reduce((sum,k)=>sum+Object.values(data.modes[m][k]||{}).filter(Boolean).length,0);return `${labels[m]} ${n/2} 小時`}).join(' ／ ')}function setSlot(b){const k=b.dataset.date,n=b.dataset.n,s=data.modes[mode];s[k]??={};if(paint)s[k][n]=true;else delete s[k][n];b.classList.toggle('on',paint);b.setAttribute('aria-pressed',paint);summary();save()}
function render(){const ds=ids();$('teacher').value=data.teacher||'';$('range').textContent=`${ds[0].replaceAll('-','/')} – ${ds[6].replaceAll('-','/')}`;$('date').value=ds[0];for(const id of ['zone','start','end'])$(id).value=data[id];$('online').classList.toggle('active',mode==='online');$('inperson').classList.toggle('active',mode==='inperson');$('copyMode').textContent='將目前設定套用到'+labels[mode==='online'?'inperson':'online'];$('editing').textContent=`目前編輯：${labels[mode]}`;const wrap=$('grid');wrap.replaceChildren();wrap.classList.toggle('inperson',mode==='inperson');for(let week=0;week<1;week++){const section=document.createElement('section');section.className='week-panel';const heading=document.createElement('h3');heading.textContent=`第 ${week+1} 週 · ${ds[week*7]} ～ ${ds[week*7+6]}`;section.append(heading);const scroll=document.createElement('div');scroll.className='week-scroll';const grid=document.createElement('div');grid.className='week-grid';const h=document.createElement('div');h.className='head';h.textContent='時間';grid.append(h);ds.slice(week*7,week*7+7).forEach((k,i)=>{const e=document.createElement('div');e.className='head';e.textContent=`${+k.slice(5,7)}/${+k.slice(8)}（${'一二三四五六日'[i]}）`;decorateDate(e,k);grid.append(e)});for(let n=data.start*2;n<data.end*2;n++){const t=document.createElement('div');t.className='time';t.textContent=fmt(n);grid.append(t);for(const k of ds.slice(week*7,week*7+7)){const b=document.createElement('button');b.className='slot'+(data.modes[mode][k]?.[n]?' on':'');b.dataset.date=k;b.dataset.n=n;b.setAttribute('aria-label',`${labels[mode]} ${k} ${fmt(n)}–${fmt(n+1)}`);b.title=b.getAttribute('aria-label');b.setAttribute('aria-pressed',!!data.modes[mode][k]?.[n]);b.onpointerdown=e=>{if(e.pointerType==='mouse'){e.preventDefault();painting=true;paint=!data.modes[mode][k]?.[n];setSlot(b)}};b.onpointerenter=()=>{if(painting)setSlot(b)};b.onclick=e=>{if(e.detail===0||e.pointerType!=='mouse'){paint=!data.modes[mode][k]?.[n];setSlot(b)}};grid.append(b)}}scroll.append(grid);section.append(scroll);wrap.append(section)}const list=$('list');list.replaceChildren();const listHeading=document.createElement('p');listHeading.className='hint';const upcoming=upcomingIds();listHeading.textContent='本週至後續四週（共五週）：'+upcoming[0]+' ～ '+upcoming[34];list.append(listHeading);let listDays=0;for(const k of upcoming){if(!Object.keys(labels).some(m=>spans(k,m).length))continue;const row=document.createElement('div');row.className='day';const title=document.createElement('strong');const d=new Date(k+'T12:00:00');title.textContent=`${k}（${'日一二三四五六'[d.getDay()]}）`;decorateDate(title,k);row.append(title);const content=document.createElement('div');for(const m of Object.keys(labels)){const line=document.createElement('div');line.className='mode-line';const label=document.createElement('b');label.textContent=labels[m];label.className=m==='inperson'?'offline-label':'online-label';line.append(label);const r=spans(k,m);if(!r.length){const e=document.createElement('span');e.textContent=' 未設定';e.className='hint';line.append(e)}for(const[a,b]of r){const tag=document.createElement('span');tag.className='pill '+m;tag.textContent=`${fmt(a)} – ${fmt(b)}`;line.append(tag)}content.append(line)}row.append(content);list.append(row);listDays++}if(!listDays)list.innerHTML+='<div class="empty">本週至後續四週尚未設定可上課時段。請切換行事曆，分別選擇線上或線下進行設定。</div>';$('gridWrap').hidden=view!=='calendar';list.hidden=view!=='list';$('calendar').classList.toggle('active',view==='calendar');$('listBtn').classList.toggle('active',view==='list');summary()}
$('teacher').oninput=()=>{data.teacher=$('teacher').value;save()};document.addEventListener('pointerup',()=>painting=false);window.addEventListener('blur',()=>painting=false);for(let i=0;i<24;i++)$('start').add(new Option(`${String(i).padStart(2,'0')}:00`,i));for(let i=1;i<=24;i++)$('end').add(new Option(`${String(i).padStart(2,'0')}:00`,i));for(const id of ['start','end'])$(id).onchange=()=>{const s=+$('start').value,e=+$('end').value;if(s>=e){$('notice').textContent='結束時間需晚於開始時間';render();return}data.start=s;data.end=e;save();render()};$('zone').onchange=()=>{data.zone=$('zone').value;save()};for(const m of Object.keys(labels))$(m).onclick=()=>{painting=false;mode=m;render()};$('prev').onclick=()=>{base.setDate(base.getDate()-7);render()};$('next').onclick=()=>{base.setDate(base.getDate()+7);render()};$('today').onclick=()=>{base=monday(new Date());render()};$('date').onchange=()=>{if($('date').value){base=monday(new Date($('date').value+'T12:00:00'));render()}};$('calendar').onclick=()=>{view='calendar';render()};$('listBtn').onclick=()=>{view='list';render()};$('clear').onclick=()=>{if(confirm(`清除這一週的${labels[mode]}時段？另一種類型會保留。`)){ids().forEach(k=>delete data.modes[mode][k]);save();render()}};$('copyMode').onclick=()=>{const target=mode==='online'?'inperson':'online';const days=ids();if(days.some(k=>spans(k,target).length)&&!confirm('這一週的'+labels[target]+'已有時段，確定以目前'+labels[mode]+'的設定取代？'))return;for(const k of days)data.modes[target][k]={...data.modes[mode][k]};save();render();$('notice').textContent='已將本週'+labels[mode]+'時段套用到'+labels[target]};$('copyWeek').onclick=()=>{const old=ids(),source=old.map(k=>({...data.modes[mode][k]})),target=old.map((_,i)=>{const d=day(i);d.setDate(d.getDate()+7);return dateKey(d)});if(target.some(k=>spans(k).length)&&!confirm(`下一週已有${labels[mode]}時段，確定取代？`))return;target.forEach((k,i)=>data.modes[mode][k]=source[i]);base.setDate(base.getDate()+7);save();render()};
function textList(){const dates=exportIds();if(!dates)return null;return `我是 ${data.teacher.trim()||'未填姓名'}\nTAPI可上課時段（${data.zone}）\n${dates[0]} ～ ${dates.at(-1)}\n每格30分鐘，以下為開始至結束時間。\n\n`+dates.filter(k=>Object.keys(labels).some(m=>spans(k,m).length)).map(k=>`${k}${holidays[k]?' '+holidays[k]:''}\n`+Object.keys(labels).map(m=>`${labels[m]}：${spans(k,m).map(([a,b])=>fmt(a)+'–'+fmt(b)).join('、')||'未設定'}`).join('\n')).join('\n\n')}function download(content,name,type){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('copy').onclick=async()=>{const text=textList();if(text===null)return;try{await navigator.clipboard.writeText(text);$('notice').textContent='已複製文字檔（含線上與線下）'}catch{download(text,'TAPI時段清單.txt','text/plain;charset=utf-8')}};$('txt').onclick=()=>{const text=textList();if(text!==null)download(text,'TAPI時段清單.txt','text/plain;charset=utf-8')};$('csv').onclick=()=>{const dates=exportIds();if(!dates)return;const rows=[['老師姓名','日期','星期','日本祝日','上課類型','開始時間','結束時間','時區']];for(const k of dates)for(const m of Object.keys(labels))for(const[a,b]of spans(k,m))rows.push([data.teacher.trim(),k,'日一二三四五六'[new Date(k+'T12:00:00').getDay()],holidays[k]||'',labels[m],fmt(a),fmt(b),data.zone]);download('\uFEFF'+rows.map(r=>r.map(v=>'"'+v.replaceAll('"','""')+'"').join(',')).join('\r\n'),'TAPI上課時段.csv','text/csv;charset=utf-8')};$('backup').onclick=()=>download(JSON.stringify(data,null,2),'TAPI全部時段備份.json','application/json');$('restore').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{const v=normalize(JSON.parse(await f.text()));if(confirm('以備份取代目前全部線上與線下時段？舊版備份會歸入線上。')){data=v;save();render()}}catch{$('notice').textContent='備份格式不正確，未更動資料。'}$('file').value=''};
function stamp(k,n){const d=new Date(k+'T12:00:00');if(n===48){d.setDate(d.getDate()+1);n=0}return dateKey(d).replaceAll('-','')+'T'+fmt(n).replace(':','')+'00'}function calendarFile(){const dates=exportIds();if(!dates)return null;const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TAPI//Lesson Slots//ZH','CALSCALE:GREGORIAN'];const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z/,'Z');for(const k of dates)for(const m of Object.keys(labels))for(const[a,b]of spans(k,m))lines.push('BEGIN:VEVENT',`UID:${k}-${m}-${a}-${b}@tapi-slots`,`DTSTAMP:${now}`,`DTSTART;TZID=${data.zone}:${stamp(k,a)}`,`DTEND;TZID=${data.zone}:${stamp(k,b)}`,`SUMMARY:可上課・${labels[m]}`,`CATEGORIES:${m==='online'?'オンライン':'対面'}`,'TRANSP:TRANSPARENT','END:VEVENT');lines.push('END:VCALENDAR');return lines.join('\r\n')+'\r\n'}$('ics').onclick=()=>{const content=calendarFile();if(content!==null)download(content,'TAPI上課時段.ics','text/calendar;charset=utf-8')};$('exportStart').value=upcomingIds()[0];$('exportEnd').value=upcomingIds()[34];render();
